name: Build StreamFlix Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          mkdir -p frontend/android
          echo "flutter.sdk=$FLUTTER_ROOT" > frontend/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> frontend/android/local.properties
          echo "flutter.buildMode=release" >> frontend/android/local.properties
          echo "flutter.versionName=1.0.0" >> frontend/android/local.properties
          echo "flutter.versionCode=1" >> frontend/android/local.properties

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Universal Android Release APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlix-Android-APKs
          path: frontend/build/app/outputs/flutter-apk/*.apk
