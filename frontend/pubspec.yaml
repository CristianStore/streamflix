name: streaming_flutter_app
description: "Aplicación de streaming de películas y series estilo Netflix/Stremio para Android TV y Móvil"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Gestión de estado
  provider: ^6.1.2
  # Peticiones HTTP
  http: ^1.2.2
  # Reproductor de video nativo y listas HLS (.m3u8)
  video_player: ^2.9.2
  chewie: ^1.8.5
  # WebView para reproductores embed (sin sandbox; JS bloquea window.open)
  webview_flutter: ^4.10.0
  # Almacenamiento local de tokens de sesión
  shared_preferences: ^2.3.3
  # Carga y caché de imágenes de póster / backdrop
  cached_network_image: ^3.4.1
  # Fuentes e iconos modernos
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
