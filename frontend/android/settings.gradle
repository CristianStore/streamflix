pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir, 'local.properties')
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { properties.load(it) }
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv('FLUTTER_ROOT')
        }
        return sdkPath
    }

    def sdkDir = flutterSdkPath()
    if (sdkDir != null && !sdkDir.trim().isEmpty()) {
        includeBuild("${sdkDir}/packages/flutter_tools/gradle")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"


